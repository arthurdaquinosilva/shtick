[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shtick"
version = "0.1.4"
description = "A playground for writing and testing shell scripts — run cells in a persistent shell, trace, lint, sandbox and assert."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arthur D'Aquino", email = "arthurdaquinosilva@gmail.com" }]
keywords = ["shell", "bash", "repl", "testing", "shellcheck", "terminal", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Unix Shell",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Shells",
    "Topic :: Terminals",
]
dependencies = [
    "prompt_toolkit>=3.0.43",
    "rich>=13.8",
    "pygments>=2.15",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "pyte", "pexpect", "pyflakes", "build", "twine"]

[project.urls]
Homepage = "https://github.com/arthurdaquinosilva/shtick"
Documentation = "https://github.com/arthurdaquinosilva/shtick/tree/main/docs"
Issues = "https://github.com/arthurdaquinosilva/shtick/issues"
Changelog = "https://github.com/arthurdaquinosilva/shtick/blob/main/CHANGELOG.md"

[project.scripts]
shtick = "shtick.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
